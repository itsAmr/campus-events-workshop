name: Verify workshop

on:
  push:
    branches:
      - main
      - solution
      - checkpoint/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every workspace
        run: npm run build --workspaces --if-present

      - name: Test the completed solution
        if: github.ref_name == 'solution'
        run: npm test

      - name: Test the completed REST and versioning checkpoint
        if: github.ref_name == 'checkpoint/2-versioning'
        run: npm test --workspace api

      - name: Check the workshop environment
        run: npm run doctor

  devcontainer:
    name: Codespaces devcontainer
    if: github.ref_name == 'solution'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Build and test inside the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: npm ci && npm run build --workspaces --if-present && npm test && npm run doctor
