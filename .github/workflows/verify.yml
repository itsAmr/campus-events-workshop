name: Verify workshop

on:
  push:
    branches:
      - main
      - solution
      - checkpoint/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build every workspace
        run: npm run build --workspaces --if-present

      - name: Run the checks for every part this branch has completed
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            checkpoint/0-database) parts="0" ;;
            checkpoint/1-rest) parts="0 1" ;;
            checkpoint/2-responses) parts="0 1 2" ;;
            solution) npm test; exit 0 ;;
            *) parts="" ;;
          esac
          for part in $parts; do npm run "check:$part"; done
          npm run todos

      - name: Check the workshop environment
        run: npm run doctor

  devcontainer:
    name: Codespaces devcontainer
    if: github.ref_name == 'solution'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Build and test inside the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: npm ci && npm run build --workspaces --if-present && npm test && npm run doctor
